<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profil Pelajar — KKJU</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- NAVBAR -->
  <div class="navbar">
    <div class="brand">
      <div>
        <span class="brand-text">🎓 KKJU — Sijil Khas Pemprosesan Makanan</span>
        <span class="brand-sub">Kolej Komuniti Jelebu</span>
      </div>
    </div>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="pelajar.html" class="active">Pelajar</a>
      <a href="aktiviti.html">Aktiviti</a>
      <a href="industri.html">Industri</a>
    </nav>
  </div>

  <!-- CONTENT -->
  <div class="page-wrapper">
    <div class="page-title">👤 Profil Pelajar</div>

    <div class="card">
      <div class="card-header">
        <span class="card-title">Senarai Pelajar</span>
        <button class="btn btn-primary" onclick="bukaModal()">+ Tambah Pelajar</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>No. Matrik</th>
              <th>Nama Penuh</th>
              <th>No. IC</th>
              <th>No. Tel</th>
              <th>Kohort</th>
              <th>Status</th>
              <th>Tindakan</th>
            </tr>
          </thead>
          <tbody id="tbody-pelajar"></tbody>
        </table>
      </div>
      <div id="empty-pelajar" class="empty-state" style="display:none">
        <div class="empty-icon">👤</div>
        <p>Tiada pelajar didaftarkan lagi.<br/>Klik <strong>+ Tambah Pelajar</strong> untuk mula.</p>
      </div>
    </div>
  </div>

  <!-- MODAL TAMBAH / EDIT -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-title" id="modal-title">Tambah Pelajar</div>
      <form id="form-pelajar" onsubmit="simpanPelajar(event)">
        <input type="hidden" id="edit-id" />
        <div class="form-group">
          <label>No. Matrik *</label>
          <input type="text" id="f-matrik" placeholder="cth: KKJU2024001" required />
        </div>
        <div class="form-group">
          <label>Nama Penuh *</label>
          <input type="text" id="f-nama" placeholder="Nama penuh pelajar" required />
        </div>
        <div class="form-group">
          <label>No. Kad Pengenalan *</label>
          <input type="text" id="f-ic" placeholder="cth: 001234-56-7890" required />
        </div>
        <div class="form-group">
          <label>No. Telefon</label>
          <input type="text" id="f-tel" placeholder="cth: 019-1234567" />
        </div>
        <div class="form-group">
          <label>Emel</label>
          <input type="email" id="f-emel" placeholder="emel@contoh.com" />
        </div>
        <div class="form-group">
          <label>Kohort / Tahun *</label>
          <input type="text" id="f-kohort" placeholder="cth: 2024" required />
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="f-status">
            <option value="Aktif">Aktif</option>
            <option value="Tamat">Tamat</option>
            <option value="Gugur">Gugur</option>
          </select>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="tutupModal()">Batal</button>
          <button type="submit" class="btn btn-primary">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/pelajar.js"></script>
</body>
</html>
